name: collect

on:
  schedule:
    # 15분마다. GitHub 예약 실행은 부하가 몰리면 지연·생략될 수 있어
    # 한 번 실행할 때 내부에서 5분 간격 3회를 돌려 해상도와 내성을 함께 확보합니다.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 수집 결과를 리포에 커밋하기 위해 필요

concurrency:
  group: collect
  cancel-in-progress: false # 겹치면 앞 실행이 끝날 때까지 대기 (커밋 충돌 방지)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: 수집
        run: python collect.py --count 3 --loop 300

      - name: 커밋
        run: |
          git config user.name  "collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            # 다른 실행이 먼저 푸시했을 수 있으므로 리베이스 후 재시도
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep 5
            done
            exit 1
          fi
